[package]
name = "depthbook"
version = "0.7.0"
edition = "2021"
rust-version = "1.85"
description = "In-process L2 order book store with fixed-capacity sorted sides, scale-9 integer prices, and sequence-gap detection"
repository = "https://github.com/anaxo-io/depthbook"
documentation = "https://docs.rs/depthbook"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["orderbook", "trading", "marketdata", "l2", "crypto"]
categories = ["data-structures", "finance"]
exclude = [
    "/.github",
    "/deny.toml",
    "/rust-toolchain.toml",
    # Repository tooling, not part of the library: agent guidance and the cargo-release
    # configuration. Both landed after v0.6.0 and would otherwise ship from v0.7.0 on.
    "/CLAUDE.md",
    "/release.toml",
]

[dependencies]
dashmap = "6.1"
once_cell = "1.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
# Benchmark core pinning only (benches/common/mod.rs); already in the lock file as a
# transitive dependency of criterion and proptest, so this adds nothing to the graph.
libc = "0.2"
proptest = "1.5"
serial_test = "4.0"

[[bench]]
name = "book_ops"
harness = false

[[bench]]
name = "store_ops"
harness = false

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "side_layout"
harness = false
